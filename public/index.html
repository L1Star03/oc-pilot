<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141414">
<title>OC-PILOT</title>
<style>
:root, [data-theme="orange"]{
  --bp0:#141414; --bp1:#1a1a1a; --bp2:#202020;
  --col-bg:#181818; --card-bg:#202020; --sub-bg:#1c1c1c;
  --bar-bg:#191919; --code-bg:#101010; --inp-bg:#2a2a2a; --user-bg:rgba(224,135,61,.13); --user-bd:rgba(224,135,61,.35);
  --grid:rgba(255,255,255,0);
  --ln:#2b2b2b; --ln2:#3a3a3a;
  --cy:#e0873d; --cyb:#c96f28; --tx:#d6d6d6; --dim:#9a9a9a; --mut:#6b6b6b;
  --ok:#8fb882; --wn:#d9a94a; --er:#d26a5f;
  --btn-bg:#2a2a2a; --btn-fg:#e0e0e0; --pri-bg:#c96f28; --pri-fg:#ffffff; --chip-bg:#262626;
  --glowc:rgba(224,135,61,.40);
}
[data-theme="gold"]{
  --bp0:#121210; --bp1:#181816; --bp2:#1e1e1b;
  --col-bg:#161614; --card-bg:#1e1e1b; --sub-bg:#1a1a17;
  --bar-bg:#171714; --code-bg:#0d0d0b; --inp-bg:#282825; --user-bg:rgba(212,175,55,.10); --user-bd:rgba(212,175,55,.32);
  --grid:rgba(255,255,255,0);
  --ln:#2a2a26; --ln2:#3a3a33;
  --cy:#d4af37; --cyb:#a8862c; --tx:#d2d2cf; --dim:#98988f; --mut:#6b6b62;
  --ok:#8ab07f; --wn:#d4af37; --er:#c76b60;
  --btn-bg:#282825; --btn-fg:#dedacb; --pri-bg:#a8862c; --pri-fg:#ffffff; --chip-bg:#242420;
  --glowc:rgba(212,175,55,.35);
}
[data-theme="gray"]{
  --bp0:#171717; --bp1:#1d1d1d; --bp2:#232323;
  --col-bg:#1a1a1a; --card-bg:#232323; --sub-bg:#1f1f1f;
  --bar-bg:#1b1b1b; --code-bg:#121212; --inp-bg:#2c2c2c; --user-bg:rgba(255,255,255,.06); --user-bd:rgba(255,255,255,.18);
  --grid:rgba(255,255,255,0);
  --ln:#2d2d2d; --ln2:#3d3d3d;
  --cy:#a8a8a8; --cyb:#4a4a4a; --tx:#c8c8c8; --dim:#8c8c8c; --mut:#686868;
  --ok:#93ab90; --wn:#c2ab77; --er:#c08a84;
  --btn-bg:#2b2b2b; --btn-fg:#dcdcdc; --pri-bg:#484848; --pri-fg:#ffffff; --chip-bg:#272727;
  --glowc:rgba(255,255,255,.15);
}
[data-theme="vscode"]{
  --bp0:#1e1e1e; --bp1:#252526; --bp2:#2a2a2a;
  --col-bg:#232323; --card-bg:#2a2a2a; --sub-bg:#242424;
  --bar-bg:#252526; --code-bg:#1a1a1a; --inp-bg:#3c3c3c; --user-bg:rgba(14,99,156,.22); --user-bd:#0e639c55;
  --grid:rgba(255,255,255,0);
  --ln:#303030; --ln2:#3c3c3c;
  --cy:#3794ff; --cyb:#0e639c; --tx:#cccccc; --dim:#9a9a9a; --mut:#6e6e6e;
  --ok:#4ec9a4; --wn:#d7ba63; --er:#f14c4c;
  --btn-bg:#3a3d41; --btn-fg:#ffffff; --pri-bg:#0e639c; --pri-fg:#ffffff; --chip-bg:#333333;
  --glowc:rgba(55,148,255,.30);
}
[data-theme="blueprint"]{
  --bp0:#0c0e11; --bp1:#12151a; --bp2:#171b21;
  --col-bg:rgba(17,20,25,.78); --card-bg:rgba(21,25,31,.92); --sub-bg:rgba(18,21,26,.5);
  --bar-bg:#191919; --code-bg:#101010; --inp-bg:#2a2a2a; --user-bg:color-mix(in srgb, var(--cy) 10%, transparent); --user-bd:rgba(65,164,255,.28);
  --grid:rgba(140,160,180,.05);
  --ln:rgba(140,160,180,.14); --ln2:rgba(120,180,255,.35);
  --cy:#41a4ff; --cyb:#1f7adb; --tx:#d5dae0; --dim:#8b95a1; --mut:#57606c;
  --ok:#46c98d; --wn:#e0b25c; --er:#e0756f;
  --btn-bg:#1b2333; --btn-fg:#9db4e8; --pri-bg:#1f7adb; --pri-fg:#ffffff; --chip-bg:color-mix(in srgb, var(--cy) 10%, transparent);
  --glowc:rgba(224,135,61,.40);
}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bp0);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--tx);
  font-family:"Cascadia Code","Consolas","JetBrains Mono",Menlo,monospace;
  font-size:13px;
}
button{font:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,textarea,select{font:inherit}
a{color:var(--cy)}
#app{display:flex;height:100%;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bar-bg);border-bottom:1px solid var(--ln);flex:0 0 auto}
header .brand{font-weight:700;font-size:14px;color:var(--cy);letter-spacing:2px;flex:0 0 auto}
header .brand small{color:var(--mut);font-weight:400;letter-spacing:1px;font-size:10px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--er);flex:0 0 auto}
#dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#bk{background:transparent;color:var(--cy);border:1px solid var(--ln);border-radius:6px;padding:5px 4px;font-size:11px;max-width:120px}
.hbtn{background:var(--btn-bg);color:var(--btn-fg);border-radius:3px;padding:6px 10px;font-size:11.5px;flex:0 0 auto}
.hbtn.pri{background:var(--cyb);color:#04121f;border-color:var(--cyb);font-weight:700}
#errbar{display:none;background:#3b1f24;border-bottom:1px solid var(--er);color:var(--er);padding:6px 12px;font-size:11px;flex:0 0 auto}
.qcard{background:var(--card-bg);border:1px solid var(--ln2);border-radius:4px;margin:8px 12px;padding:10px 12px}
.qcard .qh{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:6px;word-break:break-all}
.qq{margin:8px 0;padding:8px;background:var(--sub-bg);border:1px dashed var(--ln);border-radius:8px}
.qq .qqh{font-size:11px;color:var(--cy);letter-spacing:2px;margin-bottom:3px}
.qq .qqt{font-size:13px;line-height:1.5;margin-bottom:8px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--ln2);border-radius:8px;padding:9px 11px;margin-bottom:6px;color:var(--tx);font-size:13px}
.qopt.sel{border-color:var(--cy);background:var(--user-bg);box-shadow:none}
.qopt .od{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.qopt.sel .od{color:var(--dim)}
.qcustom{width:100%;background:var(--code-bg);border:1px dashed var(--ln2);border-radius:8px;color:var(--tx);padding:9px 11px;outline:none;font-size:13px;margin-top:2px}
.qbtns{display:flex;gap:8px;margin-top:8px}
.qbtns button{flex:1;padding:10px;border-radius:8px;font-size:13px}
.q-submit{background:var(--cyb);color:#fff;font-weight:700}
.q-reject{border:1px solid var(--er);color:var(--er)}
.qhint{font-size:10px;color:var(--mut);margin-top:2px;letter-spacing:1px}
#banner{flex:0 0 auto}
.perm{background:var(--card-bg);border:1px solid var(--ln2);border-radius:4px;margin:8px 12px;padding:10px 12px}
.perm .pt{color:var(--wn);font-size:12px;font-weight:700;margin-bottom:4px;word-break:break-all}
.perm .pm{color:#b9a578;font-size:11px;word-break:break-all;max-height:90px;overflow:auto}
.perm .btns{display:flex;gap:8px;margin-top:8px}
.perm button{flex:1;padding:8px;border-radius:6px;font-size:12px}
.p-yes{background:var(--pri-bg);color:var(--pri-fg);font-weight:700}.p-always{border:1px solid var(--ok);color:var(--ok)}.p-no{border:1px solid var(--er);color:var(--er)}
main{flex:1;overflow:hidden;display:flex}
#board{display:flex;gap:10px;height:100%;padding:10px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;transition:opacity .18s,transform .18s}
#board.fading{opacity:0;transform:scale(.98)}
#board.gone{display:none}
.col{display:flex;flex-direction:column;flex:1 1 0;min-width:200px;max-width:360px;background:var(--col-bg);border:1px solid var(--ln);border-radius:4px}
.col.dragover{border:1px dashed var(--cy);box-shadow:none}
.colh{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;color:var(--cy);letter-spacing:2px;border-bottom:1px dashed var(--ln);user-select:none;flex:0 0 auto}
.colh .cnt{border:1px solid var(--ln);border-radius:99px;padding:0 7px;font-size:10px;color:var(--dim)}
.colh .clr{flex:1}
.colh .arw{padding:2px 6px}
.colbody{overflow-y:auto;flex:1;min-height:0;padding:6px}
.tcard{background:var(--card-bg);border:1px solid var(--ln);border-radius:4px;padding:9px 10px;margin-bottom:7px;cursor:grab}
.tcard:active{opacity:.7}
.tcard .row1{display:flex;align-items:flex-start;gap:6px}
.tcard .title{min-width:0;font-size:13px;line-height:1.4;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.statline{margin-top:6px;font-size:10.5px;color:var(--mut);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--mut)}
.sdot.run{background:var(--cy);animation:pulse 1.3s infinite}
.sdot.rec{background:var(--wn)}
.sdot.idle{background:var(--ok)}
.sdot.warn{background:var(--er)}
.sttxt{font-size:10px;letter-spacing:1px;flex:0 0 auto;color:var(--mut)}
.sttxt.run{color:var(--cy)}
.sttxt.rec,.sttxt.warn{color:var(--wn)}
.sttxt.idle{color:var(--ok)}
.stag{flex:0 0 auto;letter-spacing:1px}
.stag.ok{color:var(--ok)}
.chip{font-size:10px;padding:2px 7px;border-radius:3px;flex:0 0 auto;letter-spacing:1px;background:var(--chip-bg)}
.chip.busy{color:var(--cy);animation:pulse 1.3s infinite}
.chip.rec{color:var(--wn)}
.chip.idle{color:var(--ok)}
.chip.none{color:var(--mut)}
@keyframes pulse{50%{opacity:.4}}
.tcard .desc{color:var(--dim);font-size:11px;margin-top:4px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:4px;background:var(--ln);border-radius:99px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyb),var(--ok));border-radius:99px}
.tmeta{color:var(--mut);font-size:10px;margin-top:6px;letter-spacing:1px}
.btnrow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.abtn{background:var(--btn-bg);color:var(--btn-fg);border-radius:3px;padding:5px 9px;font-size:11px}
.abtn.go{background:var(--pri-bg);color:var(--pri-fg);font-weight:700}
.abtn.ok{background:color-mix(in srgb, var(--ok) 16%, transparent);color:var(--ok)}
.abtn.warn{background:color-mix(in srgb, var(--wn) 14%, transparent);color:var(--wn)}
.empty{color:var(--mut);text-align:center;padding:16px 8px;font-size:11px;letter-spacing:1px;line-height:2}
.empty .big{color:var(--cy);border:1px dashed var(--ln2);border-radius:8px;padding:8px 14px;display:inline-block}
#ovl{position:fixed;inset:0;background:rgba(3,12,22,.78);display:none;z-index:40}
#ovl.open{position:static;background:none;display:flex;flex:1;min-width:0;inset:auto}
#ovl.open.fs #side{display:none}
#side{width:264px;flex:0 0 264px;border-right:1px solid var(--ln);background:var(--bar-bg);overflow-y:auto;overflow-x:hidden;animation:slideL .22s ease}
@keyframes slideL{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sgrp{border-bottom:1px dashed var(--ln)}
.sgh{display:flex;align-items:center;gap:6px;padding:9px 12px;font-size:11px;color:var(--dim);letter-spacing:2px;cursor:pointer;user-select:none}
.sgh:active{opacity:.6}
.sgh .cnt{border:1px solid var(--ln);border-radius:99px;padding:0 7px;font-size:10px;color:var(--mut)}
.sgh .clr{flex:1}
.srow{display:flex;align-items:center;gap:7px;padding:8px 12px 8px 20px;cursor:pointer;border-left:2px solid transparent}
.srow:active{background:var(--user-bg)}
.srow.on{background:var(--user-bg);border-left-color:var(--cy)}
.srow .st{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .dotr{width:6px;height:6px;border-radius:50%;background:var(--cy);flex:0 0 auto}
#ovbox{position:absolute;right:0;top:0;bottom:0;width:min(1100px,100%);background:var(--bp0);border-left:1px solid var(--ln2);display:flex;flex-direction:column;background-image:linear-gradient(rgba(140,160,180,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,180,.04) 1px,transparent 1px);background-size:26px 26px}
#ovl.open #ovbox{position:static;width:auto;flex:1;min-width:0;animation:slideR .22s ease}
@keyframes slideR{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
#ovh{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bar-bg);border-bottom:1px solid var(--ln)}
#ovtitle{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--cy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ovbody{flex:1;overflow-y:auto;min-height:0}
#tabs{display:flex;background:var(--bar-bg);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
#tabs button{flex:1;padding:10px;color:var(--mut);border-bottom:2px solid transparent;letter-spacing:2px;font-size:12.5px}
#tabs button.on{color:var(--cy);border-bottom-color:var(--cyb)}
#ovfoot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--bar-bg);border-top:1px solid var(--ln)}
#inp{flex:1 1 160px;min-width:140px;background:var(--inp-bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:9px 12px;outline:none;resize:none;font-size:15px;max-height:96px}
#send{background:var(--pri-bg);color:var(--pri-fg);border-radius:3px;padding:0 14px;font-size:13px}
#modelsel,#agentsel{max-width:130px;background:var(--inp-bg);border:1px solid var(--ln);border-radius:8px;color:var(--dim);font-size:11px;padding:4px}
#newagent{background:var(--pri-bg);color:var(--pri-fg);font-weight:700;border-radius:8px;padding:0 10px;font-size:12.5px;white-space:nowrap}
#abort{background:color-mix(in srgb, var(--er) 14%, transparent);color:var(--er);border-radius:3px;padding:0 10px;font-size:12.5px;white-space:nowrap;display:none}
.msg{margin:10px 12px;padding:10px 12px;border-radius:8px;line-height:1.65;word-break:break-word;overflow:hidden;font-size:14px}
.msg.user{background:var(--user-bg);border:1px solid var(--user-bd)}
.msg.assistant{background:rgba(18,21,26,.75);border:1px solid var(--ln)}
.msg .who{font-size:10px;color:var(--mut);margin-bottom:5px;letter-spacing:2px}
.msg p{margin:4px 0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:10px 0 6px;line-height:1.3;color:var(--cy)}
.msg h1{font-size:1.2em}.msg h2{font-size:1.1em}.msg h3{font-size:1em}
.msg ul,.msg ol{padding-left:20px;margin:6px 0}
.msg blockquote{border-left:3px solid var(--cyb);padding:2px 10px;margin:6px 0;color:var(--dim)}
.msg hr{border:none;border-top:1px dashed var(--ln2);margin:8px 0}
.cb{margin:7px 0;border-radius:6px;overflow:hidden;border:1px solid var(--ln)}
.cb .cbh{font-size:10px;color:var(--dim);background:var(--bar-bg);padding:3px 9px;letter-spacing:1px}
.cb pre{background:var(--code-bg);padding:9px;overflow-x:auto;font-size:12.5px;white-space:pre;margin:0;max-height:380px;overflow-y:auto;color:#c9d6e4}
.msg code{font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px;color:#b8d4f0}
.tw{overflow-x:auto;margin:7px 0;border:1px solid var(--ln);border-radius:6px}
.msg table{border-collapse:collapse;font-size:.9em;min-width:100%}
.msg th,.msg td{border:1px solid var(--ln);padding:5px 9px;text-align:left;white-space:nowrap}
.msg th{background:var(--bar-bg);color:var(--cy);letter-spacing:1px}
.tool{margin:8px 12px;padding:8px 10px;border-radius:6px;background:var(--sub-bg);border:1px dashed var(--ln);font-size:12.5px}
.tool .t1{display:flex;align-items:center;gap:7px}
.tool .tn{color:var(--cy);font-weight:700;flex:0 0 auto}
.tool .tt{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tool .ts{margin-left:auto;font-size:10px;flex:0 0 auto;letter-spacing:1px}
.tool .ts.completed{color:var(--ok)}.tool .ts.running{color:var(--cy)}.tool .ts.pending{color:var(--wn)}.tool .ts.error{color:var(--er)}
.mseg{margin:4px 0}
.mseg.final{border-left:3px solid var(--cy);background:rgba(255,255,255,.035);padding:9px 12px;border-radius:0 3px 3px 0;margin-top:8px}
.sub{position:relative;margin:8px 0 2px 24px;padding:7px 10px;border:1px dashed var(--ln2);border-radius:7px;background:rgba(18,21,26,.55);font-size:12px}
.sub::before{content:"";position:absolute;left:-16px;top:-10px;height:60%;width:0;border-left:1px dashed var(--ln2)}
.sub .t1{display:flex;align-items:center;gap:7px}
.sub .tn{color:var(--cy);font-weight:700;flex:0 0 auto}
.sub .tt{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sub .ts{margin-left:auto;font-size:10px;flex:0 0 auto;letter-spacing:1px}
.sub .ts.completed{color:var(--ok)}.sub .ts.running{color:var(--cy)}.sub .ts.pending{color:var(--wn)}.sub .ts.error{color:var(--er)}
.sub.agent{border-color:color-mix(in srgb, var(--ok) 45%, transparent)}
.sub.agent .tn{color:var(--ok)}
.sub.running{border-color:var(--cy);animation:glow 1.6s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--user-bg)}50%{box-shadow:0 0 14px var(--glowc)}}
.cwrap{position:relative;margin-top:8px;padding-left:18px}
.cwrap::before{content:"";position:absolute;left:5px;top:2px;bottom:4px;border-left:1px dashed var(--ln2)}
.cwrap::after{content:"";position:absolute;left:2px;width:7px;height:7px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:flowdown 1.5s linear infinite}
@keyframes flowdown{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 7px);opacity:0}}
.csub{position:relative;display:flex;gap:6px;align-items:center;border:1px dashed var(--ln2);border-radius:6px;padding:4px 8px;font-size:11px;margin-bottom:4px;background:var(--sub-bg);color:var(--dim)}
.csub::before{content:"";position:absolute;left:-13px;top:50%;width:12px;border-top:1px dashed var(--ln2)}
.csub .cn{color:var(--cy);font-weight:700;flex:0 0 auto}
.csub .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.csub.agent{border-color:color-mix(in srgb, var(--ok) 45%, transparent)}
.csub.agent .cn{color:var(--ok)}
.csub.running{border-color:var(--ln2)}
.csub.more{border:none;background:none;color:var(--mut);padding:1px 8px}
.csum{margin-top:8px;font-size:10.5px;color:var(--mut);letter-spacing:1px;border:1px dashed var(--ln);border-radius:99px;padding:3px 10px;display:inline-block;cursor:pointer;user-select:none}
.csum:active{opacity:.6}
.croles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.crole{font-size:10px;color:var(--ok);border:1px solid color-mix(in srgb, var(--ok) 30%, transparent);border-radius:99px;padding:2px 8px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:10px 12px}
.acard{border:1px solid var(--ln);border-radius:4px;padding:10px;background:var(--card-bg);display:flex;flex-direction:column;gap:7px}
.acard.warn{border-left-color:var(--wn)}
.acard.done{border-left-color:var(--ok)}
.acard .ah{display:flex;align-items:center;gap:7px}
.acard .arole{font-weight:700;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cy)}

<script>
var S = { backend: localStorage.getItem("oc_backend") || "4096", backends: [], tasks: {}, statuses: {}, perms: {}, questions: {}, sessions: {}, curTask: null, curTab: "chat", msgs: [], todos: [], diffs: [], fsMode: false, prevUpdated: {}, liveUntil: {}, editing: null, queue: {}, liveTools: {}, workerInfo: {}, toolLen: {}, stuckSince: {}, miniSid: null, cardSubOpen: {}, dbg: [], wasBusy: {}, resumed: {}, woken: {}, roleMig: {} };
function dbgLog(msg){
  S.dbg.unshift(new Date().toTimeString().slice(0,8) + " " + msg);
  if (S.dbg.length > 6) S.dbg.pop();
  var d = $("dbgbar");
  if (d) d.textContent = S.dbg.join("  |  ");
}
var $ = function(id){ return document.getElementById(id); };
(function(){
  var _f = window.fetch;
  window.fetch = function(u, o){
    o = o || {};
    try {
      var tok = localStorage.getItem("oc_token");
      if (tok && typeof u === "string" && u.charAt(0) === "/") {
        o.headers = Object.assign({}, o.headers || {}, { "x-pilot-token": tok });
      }
    } catch(e){}
    return _f.call(window, u, o).then(function(r){
      if (r.status === 401) { var d = $("tdlg"); if (d && d.style.display !== "flex") d.style.display = "flex"; }
      return r;
    });
  };
})();
function tokQS(url){
  try { var tok = localStorage.getItem("oc_token"); if (!tok) return url; return url + (url.indexOf("?") >= 0 ? "&" : "?") + "k=" + encodeURIComponent(tok); } catch(e){ return url; }
}
function toast(t){ var el=$("toast"); el.textContent=t; el.style.opacity=1; clearTimeout(el._t); el._t=setTimeout(function(){el.style.opacity=0},2400); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtTime(t){ if(!t) return ""; var d=new Date(t); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function fmtRel(t){
  if (!t) return "";
  var d = Date.now() - t;
  if (d < 60000) return Math.max(1, Math.floor(d/1000)) + "秒前";
  if (d < 3600000) return Math.floor(d/60000) + "分前";
  if (d < 86400000) return Math.floor(d/3600000) + "时前";
  if (d < 172800000) return "昨天" + fmtTime(t);
  var dt = new Date(t);
  return (dt.getMonth()+1) + "-" + dt.getDate() + " " + fmtTime(t);
}
function fmtSize(n){ if(n==null) return ""; if(n>1048576) return (n/1048576).toFixed(1)+"M"; if(n>1024) return (n/1024).toFixed(0)+"K"; return n+"B"; }
function toolTail(st){
  try {
    var o = st && st.state && st.state.output;
    if (!o) return "";
    return String(o).replace(/\s+$/,"").split("\n").slice(-5).join("\n").slice(-420);
  } catch(e){ return ""; }
}
function stOf(sid){ var o = S.statuses[sid] || {}; return o.type || o.status || ""; }
function activityOf(sid, sess){
  if (stOf(sid) === "busy") return "run";
  if (Date.now() < (S.liveUntil[sid] || 0)) return "run";
  var s = sess || S.sessions[sid];
  var upd = (s && s.time && s.time.updated) || 0;
  if (upd > Date.now() - 5*60*1000) return "recent";
  return "idle";
}

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ "Content-Type": "application/json", "x-pilot-backend": S.backend }, opts.headers || {});
  return fetch("/api" + path, opts).then(function(r){
    if (r.status === 204) return null;
    return r.text().then(function(tx){ try { return JSON.parse(tx); } catch(e){ return tx; } });
  });
}
function tApi(method, body, id){
  var url = id ? "/tasks/" + id : "/tasks";
  return fetch(url, { method: method, headers: { "Content-Type": "application/json", "x-pilot-backend": S.backend }, body: body ? JSON.stringify(body) : null })
    .then(function(r){ return r.json(); });
}

var FLOW = {
  todo:   { icon:"▣", name:"待办 TODO",   next:["plan","exec"] },
  plan:   { icon:" ◙", name:"计划 PLAN",   next:["exec","todo"] },

function mdRender(src){
  src = String(src||"").replace(/\r\n/g,"\n");
  var blocks = [];
  src = src.replace(/```([a-zA-Z0-9+#._-]*)\n?([\s\S]*?)```/g, function(m, lang, code){
    blocks.push("<div class='cb'><div class='cbh'>"+esc(lang||"code")+"</div><pre>"+esc(code.replace(/\n$/,""))+"</pre></div>");
    return "\u0001B"+(blocks.length-1)+"\u0001";
  });
  function inline(t){
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[\s(（])\*([^*\s][^*]*?)\*/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, "<a href='$2'>$1</a>");
    return t;
  }
  function splitRow(row){ return row.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){ return c.trim(); }); }
  var lines = src.split("\n");
  var html = "", i = 0, para = [];
  function flush(){ if (para.length) { html += "<p>"+para.map(inline).join("<br>")+"</p>"; para = []; } }
  while (i < lines.length){
    var L = lines[i];
    var bm = L.match(/^\u0001B(\d+)\u0001\s*$/);
    if (bm){ flush(); html += blocks[+bm[1]]; i++; continue; }
    if (/^\s*\|/.test(L) && i+1 < lines.length && /^\s*\|?[\s:|-]+(\|[\s:|-]*)*\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf("-") >= 0){
      flush();
      var head = splitRow(L); i += 2; var body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(splitRow(lines[i])); i++; }
      html += "<div class='tw'><table><thead><tr>";
      for (var c = 0; c < head.length; c++) html += "<th>"+inline(head[c])+"</th>";
      html += "</tr></thead><tbody>";
      for (var r = 0; r < body.length; r++) {
        html += "<tr>";
        for (c = 0; c < head.length; c++) html += "<td>"+inline(body[r][c]||"")+"</td>";
        html += "</tr>";
      }
      html += "</tbody></table></div>";
      continue;
    }
    var h = L.match(/^(#{1,6})\s+(.*)$/);
    if (h){ flush(); var lv = Math.min(h[1].length,4); html += "<h"+lv+">"+inline(h[2])+"</h"+lv+">"; i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)){ flush(); html += "<hr>"; i++; continue; }
    if (/^\s*>\s?/.test(L)){
      flush(); var q = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      html += "<blockquote>"+mdRender(q.join("\n"))+"</blockquote>";
      continue;
    }
    if (/^\s*[-*+]\s+/.test(L)){
      flush(); var it = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { it.push(lines[i].replace(/^\s*[-*+]\s+/,"")); i++; }
      html += "<ul>"+it.map(function(x){ return "<li>"+inline(x)+"</li>"; }).join("")+"</ul>";
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(L)){
      flush(); var it2 = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { it2.push(lines[i].replace(/^\s*\d+[.)]\s+/,"")); i++; }
      html += "<ol>"+it2.map(function(x){ return "<li>"+inline(x)+"</li>"; }).join("")+"</ol>";
      continue;
    }
    if (L.indexOf("\u0001") >= 0 && !bm) { flush(); html += L.replace(/\u0001B(\d+)\u0001/g, function(m2,n){ return blocks[+n]; }); i++; continue; }
    if (L.trim() === ""){ flush(); i++; continue; }
    para.push(L);
    i++;
  }
  flush();
  return html;
}

function findPermIDs(obj, found){
  if (!obj || typeof obj !== "object") return;
  if (Array.isArray(obj)) { for (var i=0;i<obj.length;i++) findPermIDs(obj[i], found); return; }
  if (obj.permissionID) found.push({ id: obj.permissionID, sessionID: obj.sessionID, title: obj.title || (obj.metadata && obj.metadata.title), metadata: obj.metadata, status: obj.status });
  for (var k in obj) findPermIDs(obj[k], found);
}
function handleEvent(raw){
  var ev; try { ev = JSON.parse(raw); } catch(e){ return; }
  var et = String(ev.type || "");
  var pr = ev.properties || ev;
  if (et === "question.v2.asked" && pr.id && pr.questions) {
    S.questions[pr.id] = { id: pr.id, sessionID: pr.sessionID, questions: pr.questions };
    renderQuestions();
  } else if ((et === "question.v2.replied" || et === "question.v2.rejected") && pr.requestID) {
    if (S.questions[pr.requestID]) { delete S.questions[pr.requestID]; renderQuestions(); }
  }
  var found = []; findPermIDs(ev, found);
  for (var i=0;i<found.length;i++){
    var f = found[i];
    if (["completed","resolved","rejected","approved"].indexOf(f.status) >= 0) delete S.perms[f.id];
    else S.perms[f.id] = f;
  }
  markDirty();
}

async function sseLoop(){
  while (sseCtl && !sseCtl.signal.aborted) {
    try {
      var h = { "x-pilot-backend": S.backend };
      var connectTimer = setTimeout(function(){ if (sseCtl) { try { sseCtl.abort("timeout"); } catch(e){} } }, 15000);
      var resp = await fetch("/api/event", { headers: h, signal: sseCtl.signal });
      clearTimeout(connectTimer);
      setConn(true);
      S.lastSseOk = Date.now();
      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var buf = "";
      while (true){
        var r = await reader.read();
        if (r.done) break;
        S.lastSseOk = Date.now();
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf("\n\n")) >= 0){
          var chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          var dl = chunk.split("\n").filter(function(l){ return l.indexOf("data:") === 0; }).map(function(l){ return l.slice(5).trim(); });
          if (dl.length) handleEvent(dl.join("\n"));
        }
      }
    } catch(e){}
    setConn(false);
    if (sseCtl && sseCtl.signal.aborted) return;
    for (var w = 0; w < 10 && sseCtl && !sseCtl.signal.aborted; w++) await sleep(300);
  }
}

async function checkInterruptedAndResume(sid){

function watchWake(){
  var linked = taskLinkedSids();
  for (var sid in S.statuses) {
    if ((S.statuses[sid].type || S.statuses[sid].status) === "busy") {
      S.wasBusy[sid] = 1;
      delete S.resumed[sid];

  }
  for (var sid2 in S.wasBusy) {
    var cur = (S.statuses[sid2] || {});
    var nowIdle = (cur.type || cur.status) !== "busy";
    if (nowIdle) {
      delete S.wasBusy[sid2];
      if (!S.resumed[sid2] && linked[sid2]) {
        S.resumed[sid2] = 1;
        checkInterruptedAndResume(sid2);
      }
    }
  }
  for (var sid3 in S.stuckSince) {
    if (S.stuckSince[sid3] && Date.now() - S.stuckSince[sid3] > 600000 && !S.woken[sid3] && linked[sid3]) {

      })(sid3);
    }
  }
}

async function accEngine(){
  for (var id in S.tasks) {
    var t = S.tasks[id];
    var acc = t.acc;
    if (!acc || acc.done || acc.pause) continue;
    if (taskActivity(t) === "run") continue;
    var rounds = acc.rounds || [];
    var ri = acc.cur || 0;
    if (ri >= rounds.length) { acc.done = 1; tApi("PATCH", { acc: acc }, id); continue; }
    if (acc.status === "waiting_human") continue;
    if (acc.nextAt && Date.now() < acc.nextAt) continue;
    var r = rounds[ri];
    if (r.mode === "human") {
      acc.status = "waiting_human";
      toast("「" + t.title + "」自动验收全通过，等你人工终审");
      tApi("PATCH", { acc: acc }, id);
      continue;
    }
    if (!r.cmd) { acc.cur = ri + 1; tApi("PATCH", { acc: acc }, id); continue; }
    var dir = (S.sessions[t.sessionID] || {}).directory || "";
    var res = await accRunCheck(r.cmd, dir);
    acc.history = acc.history || [];
    if (res.pass) {
      acc.history.push({ r: ri, pass: 1, out: String(res.output||"").slice(0, 200), t: Date.now() });
      acc.cur = ri + 1;
      acc.attempts = 0;
      toast("验收 R" + (ri+1) + "·" + r.name + " ✓ " + (rounds[ri+1] ? "进入 " + rounds[ri+1].name : "自动轮全部通过"));
      if (acc.cur >= rounds.length) acc.done = 1;
    } else {
      acc.attempts = (acc.attempts || 0) + 1;
      acc.history.push({ r: ri, pass: 0, out: String(res.output||"").slice(0, 300), t: Date.now() });
      if (acc.attempts >= (r.maxRetry || 3)) {
        acc.pause = 1;
        toast("⚠ 「" + t.title + "」验收轮「" + r.name + "」重试耗尽，需人工介入");
      } else {
        var fb = "（验收打回·第" + (ri+1) + "轮「" + r.name + "」第" + acc.attempts + "次未过）\n检查输出：\n" + (res.output || "无输出") + "\n请针对性修复后重新完成，验收将自动重试。";
        try { if (t.sessionID) await sendMsg(t.sessionID, fb, sendOpts()); } catch(e2){}
        acc.nextAt = Date.now() + (r.intervalMin || 3) * 60000;
        toast("「" + r.name + "」未过 → 已带证据打回 (" + acc.attempts + "/" + (r.maxRetry||3) + ")");
      }
    }
    tApi("PATCH", { acc: acc }, id);
  }
}

function autoStage(){
  for (var id in S.tasks) {
    var t = S.tasks[id];
    if (!t.sessionID && !(t.workers||[]).length) continue;
    if (t.mode === "multi" || (t.workers || []).length) {
      var ws = t.workers || [];

      if (t.stage === "exec" && t.merged && mergeDone && taskActivity(t) !== "run" && accGateOk(t)) {
        (function(tid){ tApi("PATCH", { stage: "review" }, tid); })(id);
        t.stage = "review";
      } else if (t.stage === "review" && (taskActivity(t) === "run" || (t.mergeSid && activityOf(t.mergeSid) === "run"))) {
        (function(tid){ tApi("PATCH", { stage: "exec" }, tid); })(id);
        t.stage = "exec";
      }
      continue;
    }
    var act = activityOf(t.sessionID);

    } else if (t.stage === "review" && act === "run") {

      t.stage = "exec";
    }
  }

  var prog = "";
  var s = S.sessions[t.sessionID];
  if (s && s._todo && s._todo.length) {
    var done = s._todo.filter(function(x){ return x.status === "completed"; }).length;
    prog = '<div class="bar"><i style="width:'+Math.round(done/s._todo.length*100)+'%"></i></div><div class="tmeta">TODO '+done+'/'+s._todo.length+'</div>';
  }
  var btns = "";
  var flow = FLOW[t.stage] || FLOW.todo;
  if (t.stage === "review") {
    btns += '<button class="abtn ok" data-move="done">'+NEXTLBL.done+'</button>';
    btns += '<button class="abtn warn" data-move="exec">↩ 打回</button>';
    btns += '<button class="abtn" data-rework="1">✎ 意见</button>';
  } else {
    for (var i=0;i<flow.next.length;i++){
      var nx = flow.next[i];
      var cls = "abtn" + (nx === "exec" ? " go" : (nx === "done" ? " ok" : ((nx === "todo" && t.stage !== "plan") ? " warn" : "")));
      btns += '<button class="'+cls+'" data-move="'+nx+'">'+NEXTLBL[nx]+'</button>';
    }
    if (t.stage === "exec" && act === "run") btns += '<button class="abtn" data-abort="1" style="background:color-mix(in srgb, var(--er) 14%, transparent);color:var(--er)">■ 中断</button>';
  }
  var subs = "";
  var wlist = (t.stage === "done" && t.merged) ? [] : (t.workers || []);
  if (wlist.length) {
    var runWs = [], doneWs = [];
    for (var sw=0; sw<wlist.length; sw++) {
      (activityOf(wlist[sw].sessionID) === "run" ? runWs : doneWs).push(wlist[sw]);
    }
    if (t.merged && !runWs.length) {
      var copen = S.cardSubOpen && S.cardSubOpen[t.id];
      subs = '<div class="csum" data-csum="'+t.id+'">⬡ '+wlist.length+' 路分工 · 已汇总 '+(copen?"▴":"▾")+'</div>';
      if (copen) {
        subs += '<div class="croles">' + doneWs.map(function(x){ return '<span class="crole">✓ '+esc(x.role)+'</span>'; }).join("") + '</div>';
      }
    } else {
    subs += '<div class="cwrap">';
    var wTotal = wlist.length + (t.merged ? 0 : 1);
    for (var wi=0; wi<wlist.length && wi<3; wi++) {
      var wAct = activityOf(wlist[wi].sessionID);
      subs += '<div class="csub agent '+(wAct==="run"?"running":"")+'"><span>◈</span><span class="cn">'+esc(wlist[wi].role)+'</span><span class="ct">'+(wAct==="run"?"执行中":(t.merged?"已完成":"待汇总"))+'</span></div>';
    }
    if (!t.merged && t.sessionID) subs += '<div class="csub running"><span>⌘</span><span class="cn">汇总</span><span class="ct">'+(activityOf(t.sessionID)==="run"?"合并验收中":"待完成")+'</span></div>';
    if (wTotal > 4) subs += '<div class="csub more">+'+(wTotal-4)+' more</div>';
    subs += '</div>';
    }
  } else if (t.sessionID && !(t.stage === "done")) {
    var kids = Object.keys(S.sessions).filter(function(k){ return S.sessions[k].parentID === t.sessionID; });
    var lts = S.liveTools[t.sessionID] || [];
    var total = kids.length + lts.length;
    if (total) {
      subs = '<div class="cwrap">';
      var shown = 0;
      for (var li=0; li<lts.length && shown<4; li++, shown++) subs += '<div class="csub running"><span>⚙</span><span class="cn">'+esc(lts[li].tool)+'</span><span class="ct">'+esc(lts[li].title)+'</span></div>';
      for (li=0; li<kids.length && shown<4; li++, shown++) {
        var ks = S.sessions[kids[li]];
        var krun = activityOf(ks.id) === "run";
        subs += '<div class="csub agent '+(krun?"running":"")+'"><span>◈</span><span class="cn">子AGENT</span><span class="ct">'+esc(ks.title || ks.id.slice(4,14))+'</span><span style="flex:0 0 auto;font-size:10px;color:'+(krun?"var(--cy)":"var(--mut)")+'">'+(krun?"RUN":"IDLE")+'</span></div>';
      }
      if (total > 4) subs += '<div class="csub more">+'+(total-4)+' more</div>';
      subs += '</div>';
    }
  }
  return '<div class="tcard" draggable="true" data-id="'+t.id+'">' +
    '<div class="title">'+esc(t.title)+'</div>' +
    '<div class="statline">'+line+'</div>' +
    (t.desc ? '<div class="desc">'+esc(t.desc)+'</div>' : "") + prog +
    '<div class="btnrow">'+btns+'</div>'+subs+'</div>';
}

function bindBoard(){
  var tgl = document.querySelector("[data-tgl]");
  if (tgl) tgl.onclick = function(e){
    e.stopPropagation();
    var body = this.closest(".col").querySelector(".colbody");
    var show = body.style.display === "none";
    body.style.display = show ? "" : "none";
    this.textContent = show ? "▴" : "▾";
  };
  var cards = document.querySelectorAll(".tcard");
  for (var i=0;i<cards.length;i++){
    var c = cards[i];
    (function(card){
      var cid = card.getAttribute("data-id");
      var lp = null;
      card._fired = false;
      card.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", cid); this.style.opacity=.5; });
      card.addEventListener("dragend", function(){ this.style.opacity=1; });
      card.addEventListener("touchstart", function(){ card._fired = false; lp = setTimeout(function(){ card._fired = true; askDeleteTask(cid); }, 650); }, {passive:true});
      card.addEventListener("touchend", function(){ clearTimeout(lp); }, {passive:true});
      card.addEventListener("touchmove", function(){ clearTimeout(lp); }, {passive:true});
      card.addEventListener("contextmenu", function(e){ e.preventDefault(); askDeleteTask(cid); });
      card.addEventListener("click", function(e){
        if (e.target.getAttribute("data-move") || card._fired) return;
        openDetail(cid);
      });
    })(c);
    var btns = c.querySelectorAll("[data-move]");
    for (var j=0;j<btns.length;j++) btns[j].addEventListener("click", function(e){
      e.stopPropagation();
      moveTask(this.closest(".tcard").getAttribute("data-id"), this.getAttribute("data-move"));
    });
    var csums = c.querySelectorAll("[data-csum]");
    for (j=0;j<csums.length;j++) csums[j].addEventListener("click", function(e){
      e.stopPropagation();
      var tid = this.getAttribute("data-csum");
      if (!S.cardSubOpen) S.cardSubOpen = {};
      S.cardSubOpen[tid] = !S.cardSubOpen[tid];
      renderBoard._sig = "";
      renderBoard();
    });
    var rw = c.querySelectorAll("[data-rework]");
    for (j=0;j<rw.length;j++) rw[j].addEventListener("click", function(e){
      e.stopPropagation();
      openRework(this.closest(".tcard").getAttribute("data-id"));
    });
    var ab = c.querySelectorAll("[data-abort]");
    for (j=0;j<ab.length;j++) ab[j].addEventListener("click", function(e){
      e.stopPropagation();
      var cid = this.closest(".tcard").getAttribute("data-id");
      var tk = S.tasks[cid];
      if (tk && tk.sessionID) {
        toast("正在多通道发送中止信号…");
        abortAnywhere(tk.sessionID).then(function(h){ toast(h > 0 ? "已中止（命中 " + h + " 个实例）" : "中止失败：会话不在已知实例上"); markDirty(); });
      }
    });
  }
  var cols = document.querySelectorAll(".col");
  for (var k=0;k<cols.length;k++){
    cols[k].addEventListener("dragover", function(e){ e.preventDefault(); this.classList.add("dragover"); });
    cols[k].addEventListener("dragleave", function(){ this.classList.remove("dragover"); });
    cols[k].addEventListener("drop", function(e){
      e.preventDefault();
      this.classList.remove("dragover");
      var id = e.dataTransfer.getData("text/plain");
      var to = this.getAttribute("data-stage");
      if (id && to) moveTask(id, to, null, true);
    });
  }
}

async function moveTask(id, to, feedback, quiet){
  var t = S.tasks[id];
  if (!t) return;
  var from = t.stage;
  var flow = FLOW[from] || FLOW.todo;
  if (flow.next.indexOf(to) < 0) { toast("不能从「" + (FLOW[from]||{}).name + "」移到「" + (FLOW[to]||{}).name + "」"); return; }
  try {
    if (to === "plan" && from !== "review") {
      var sid1 = await ensureSession(t);
      if (t.mode === "multi") {
        await sendMsg(sid1, "任务：" + t.title + (t.desc ? "\n描述：" + t.desc : "") + "\n\n这是多智能体协同任务，请完成规划：\n1) 分析任务，梳理实际执行流程；\n2) 设计 2~4 路并行分工方案：按任务实际流程/模块划分（不要照搬固定模板，要贴合本任务，每路给出「角色名：职责说明」）；\n3) 用 question 工具向用户列出你设计的几个候选分工方案让用户选择；\n4) 用户确认后，输出最终计划（todo 清单），并在最后一行严格按此格式输出分工：\nSPLIT: 角色1：职责 | 角色2：职责 | 角色3：职责\n此阶段不要实际修改任何文件。");
      } else {
        await sendMsg(sid1, "任务：" + t.title + (t.desc ? "\n描述：" + t.desc : "") + "\n\n请先分析这个任务并制定执行计划：用 todo 工具列出清晰的执行步骤清单，说明每一步要做什么。此阶段不要实际修改任何文件。");
      }
    } else if (to === "plan" && from === "review") {
      if (!quiet) {
        var sidp = await ensureSession(t);
        await sendMsg(sidp, "验收未通过，需要重新规划。" + (feedback ? "\n验收意见：" + feedback : "") + "\n请重新分析问题，基于反馈给出修订后的执行计划（更新 todo 清单），先不要大规模修改文件。");
      }
    } else if (to === "exec" && from !== "review") {
      if (t.mode === "multi") {
        var planCtx = "";
        if (t.sessionID) planCtx = await lastAssistantText(t.sessionID);
        await spawnWorkers(t, planCtx);
      } else {
        var sid2 = await ensureSession(t);
        var msg = (from === "plan")
          ? "计划已确认，请按上面的 todo 清单开始逐步执行，每完成一步及时更新清单。"
          : "任务：" + t.title + (t.desc ? "\n描述：" + t.desc : "") + "\n\n请创建 todo 清单并直接开始执行，完成所有步骤。";
        await sendMsg(sid2, msg);
      }
    } else if (to === "exec" && from === "review") {
      if (!quiet) {
        var sid3 = await ensureSession(t);
        await sendMsg(sid3, "验收未通过，请继续修改直到满足任务要求。" + (feedback ? "\n验收意见：" + feedback : ""));
      }
      if (t.acc && t.acc.status === "waiting_human") {
        t.acc.status = "";
        t.acc.attempts = (t.acc.attempts || 0) + 1;
        t.acc.nextAt = Date.now() + 60000;
        await tApi("PATCH", { acc: t.acc }, id);
      }
    } else if (to === "todo") {
      if (t.sessionID && activityOf(t.sessionID) === "run") await api("/session/" + t.sessionID + "/abort", { method: "POST" });
    } else if (to === "review") {
      if (t.sessionID && activityOf(t.sessionID) === "run") { toast("还在执行中，先等它跑完"); return; }
    }
    await tApi("PATCH", { stage: to }, id);
    t.stage = to; t.updated = Date.now();
    renderBoard._sig = "";
    refreshAll();
    toast("→ " + (FLOW[to]||{}).name);
  } catch(e){ toast("操作失败: " + (e.message||e)); }
}

function parseSplit(text){
  if (!text) return null;
  var m = text.match(/SPLIT[:：]\s*([^\n]+)/);
  if (!m) return null;
  var parts = m[1].split(/[|｜;;]/).map(function(x){ return x.trim(); }).filter(Boolean);
  if (parts.length < 2) return null;
  return parts.slice(0, 4).map(function(p){
    var seg = p.split(/[:：]/);
    return seg.length > 1 ? { key: seg[0].trim(), prompt: seg.slice(1).join(":").trim() } : { key: p, prompt: "分工方向：「" + p + "」。请按此分工独立完成你负责的部分。" };
  });
}
async function progressSummary(sid, cap){
  cap = cap || 3200;
  var out = "";
  try {
    var msgs = await api("/session/" + sid + "/message?limit=100");
    var finals = [];
    for (var i=(msgs||[]).length-1; i>=0 && finals.length<3; i--) {
      if ((msgs[i].info||{}).role !== "assistant") continue;
      var parts = msgs[i].parts || [];
      var lt = -1;
      for (var j=0;j<parts.length;j++) if (parts[j].type === "tool") lt = j;
      var tx = [];
      for (j=0;j<parts.length;j++) if (parts[j].type === "text" && parts[j].text && j > lt) tx.push(parts[j].text);
      var t2 = tx.join("\n").trim();
      if (t2) finals.push(t2);
    }
    if (finals.length) {
      out += "【主线最近汇报（新→旧）】\n";
      for (i=0;i<finals.length;i++) out += "· " + finals[i].slice(0, 1100) + "\n\n";
    }
  } catch(e){}
  try {
    var todo = await api("/session/" + sid + "/todo");
    if (todo && todo.length) {

    }

}
async function buildTranscript(sid){
  var msgs = await api("/session/" + sid + "/message?limit=500");
  var lines = [];
  var total = 0;
  for (var i=0;i<(msgs||[]).length;i++){
    var m = msgs[i], info = m.info || {};
    var parts = m.parts || [];
    var lt = -1;
    for (var j=0;j<parts.length;j++) if (parts[j].type === "tool") lt = j;
    var seg = "";
    for (j=0;j<parts.length;j++){
      var p = parts[j];
      if (p.type === "text" && p.text) {
        if (p.type === "text" && info.role === "assistant" && j <= lt) continue;
        seg += p.text.slice(0, 1500);
      } else if (p.type === "tool") {
        var st = (p.state||{}).status || "";
        var ttl = (p.state && (p.state.title || p.state.name)) || "";
        seg += "\n  [" + (p.tool||"tool") + (ttl ? ":" + ttl.slice(0,60) : "") + " " + st + "]";
      }
    }
    if (!seg.trim()) continue;
    var line = (info.role === "user" ? "【用户】" : "【AI】") + seg.trim();
    if (total + line.length > 60000) { lines.push("…（更早内容已截断）"); break; }
    lines.push(line);
    total += line.length;
  }
  return lines.join("\n");
}
var ctxCache = {};
async function compactContext(sid){
  if (!sid) return { kind: "none", text: "" };
  var s = S.sessions[sid];
  var key = sid + ":" + ((s && s.time && s.time.updated) || 0);
  if (ctxCache[key]) return ctxCache[key];
  var result;
  try {
    var tx = await buildTranscript(sid);
    if (!tx) { result = { kind: "none", text: "" }; ctxCache[key] = result; return result; }
    if (tx.length < 8000) {
      result = { kind: "full", text: tx };
    } else {
      var sum = await api("/session", { method: "POST", body: JSON.stringify({ title: "#上下文压缩(临时)" }) });
      var resp = await api("/session/" + sum.id + "/message", { method: "POST", body: JSON.stringify({ parts: [{ type: "text", text: "下面是一个 opencode 会话的完整记录。请压缩成给接手智能体的交接摘要，严格按此结构输出（总共不超过700字）：\n1. 任务目标与原始要求\n2. 当前状态（进行到哪）\n3. 已完成（要点+关键文件）\n4. 关键决策与失败教训\n5. 未完成/待办\n6. 注意事项（环境、坑）\n\n=== 会话记录 ===\n" + tx.slice(0, 50000) }] }) });
      var outTx = [];
      var rParts = (resp && resp.parts) || [];
      for (var k=0;k<rParts.length;k++) if (rParts[k].type === "text" && rParts[k].text) outTx.push(rParts[k].text);
      var sumText = outTx.join("\n").trim();
      try { await api("/session/" + sum.id, { method: "DELETE" }); } catch(e4){}
      if (sumText) result = { kind: "compressed", text: sumText };
      else result = { kind: "partial", text: await progressSummary(sid) };
    }
  } catch(e){ result = { kind: "partial", text: "" }; try { result.text = await progressSummary(sid); } catch(e2){} }
  ctxCache[key] = result;
  return result;
}

function taskActivity(t){

  for (var i=0;i<ws.length;i++) if (activityOf(ws[i].sessionID) === "run") return "run";

async function lastAssistantText(sid){

    var msgs = await api("/session/" + sid + "/message?limit=100");

    var icon = st === "pass" ? "✓" : (st === "current" ? (isHuman ? "◉" : "▶") : (st === "fail" ? "✗" : (isHuman ? "◎" : "○")));
    var name = esc(r.name || (isHuman ? "人工验收" : "检查" + (i+1)));
    html += '<div class="accstep ' + st + (isHuman ? " human" : "") + '"><div class="acci ' + st + '">' + icon + '</div><div class="accn">' + name + '</div>' + (r.maxRetry ? '<div class="accr">' + ((acc.cur||0) === i && !acc.done ? ("重试 " + (acc.attempts||0) + "/" + r.maxRetry) : (r.intervalMin + "min")) + '</div>' : "") + '</div>';
    if (i < rounds.length - 1) html += '<div class="accline ' + (i < (acc.cur||0) || acc.done ? "done" : "") + '"></div>';
  }
  html += '</div>';
  var hist = (acc.history || []).slice().reverse();
  if (hist.length) {
    html += '<div style="padding:14px 14px 4px;font-size:11px;color:var(--mut);letter-spacing:2px">检查记录（新→旧）</div>';
    for (var h=0; h<Math.min(hist.length, 12); h++) {
      var e = hist[h];
      html += '<div class="acchist"><span class="' + (e.pass ? "hok" : "hfail") + '">' + (e.pass ? "✓" : "✗") + '</span><span class="hmeta">R' + (e.r+1) + ' · ' + fmtRel(e.t) + '</span><div class="hout">' + esc(e.out || "") + '</div></div>';
    }
  }
  html += '<div style="display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap">';
  if (acc.status === "waiting_human") {
    html += '<button class="abtn go" id="accpass" style="padding:10px 22px">✓ 通过并完成</button>';
    html += '<button class="abtn warn" id="accreject" style="padding:10px 22px">✎ 打回修改</button>';
  } else if (!acc.done && !acc.pause) {
    html += '<button class="abtn" id="accnow" style="padding:10px 22px">⟳ 立即检查</button>';
  }
  if (acc.pause) html += '<button class="abtn" id="accresume" style="padding:10px 22px">▶ 恢复验收</button>';
  html += '</div>';
  dv.innerHTML = html;
  var now = $("accnow");
  if (now) now.onclick = function(){ if (t.acc) { t.acc.nextAt = 0; renderAccView._sig = ""; fetch("/tasks/" + t.id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acc: t.acc }) }).then(function(){ toast("已触发服务端立即检查"); }); } };
  var rs = $("accresume");
  if (rs) rs.onclick = function(){ if (t.acc) { t.acc.pause = 0; t.acc.attempts = 0; renderAccView._sig = ""; tApi("PATCH", { acc: t.acc }, t.id); refreshAll(); } };
  var ap = $("accpass");
  if (ap) ap.onclick = function(){ moveTask(t.id, "done", null, true); };
  var ar = $("accreject");
  if (ar) ar.onclick = function(){ openRework(t.id); };
}

function updateAgentsLive(){
  var t = S.curTask;

    if (!w) continue;
    var act = activityOf(sid);
    var wi = S.workerInfo[sid] || { seen: 0, running: "", lastText: "", out: "", toolStart: 0 };
    var since = wi.seen ? fmtRel(wi.seen) : "—";
    var stuck = (act === "run" && wi.seen && Date.now() - wi.seen > 180000);
    var runSecs = (act === "run" && wi.toolStart) ? Math.round((Date.now() - wi.toolStart)/1000) : 0;
    card.className = "acard " + (stuck ? "warn" : (act !== "run" ? "done" : "")) + (card.classList.contains("xopen") ? " xopen" : "");
    var chip = card.querySelector(".ah .chip");

      if (act === "run") { chip.className = "chip " + (stuck ? "rec" : "busy"); chip.textContent = stuck ? "⚠ 疑似卡住" : "● 运行"; }
      else { chip.className = "chip idle"; chip.textContent = "○ 空闲"; }

    var alive = card.querySelector(".alive");
    var mshort = modelShort(wi.model);

    if (alive) {
      var doingTxt = "";

    }
    var todo = S.sessions[sid] && S.sessions[sid]._todo;
    var pw = card.querySelector(".progwrap");

      if (todo && todo.length) {
        var done = todo.filter(function(x){ return x.status === "completed"; }).length;
        pw.innerHTML = '<div class="bar"><i style="width:'+Math.round(done/todo.length*100)+'%"></i></div><div class="tmeta">TODO '+done+'/'+todo.length+'</div>';
      } else pw.innerHTML = "";
    }
    var sn = card.querySelector(".asnip");
    if (sn) sn.textContent = wi.lastText ? wi.lastText.slice(0,120) : "";
    var xb = card.querySelector(".axbody");
    if (xb && wi.lastText) {
      var ticon = { completed:"✅", in_progress:"🔵", pending:"⬜", cancelled:"❌" };
      var xh = '<div class="axrep">'+esc(wi.lastText)+'</div>';

        xh += '<div class="axtodo">';
        for (var ti=0;ti<todo.length;ti++) xh += '<div class="todo '+todo[ti].status+'" style="padding:5px 0;font-size:11.5px;border-bottom:none"><div class="st">'+(ticon[todo[ti].status]||"⬜")+'</div><div class="ct">'+esc(todo[ti].content)+'</div></div>';
        xh += '</div>';
      }
      var wSess = S.sessions[sid] || {};
      xh += '<div class="axmeta">'+esc(sid.slice(4,14))+' · 更新 '+since+(wSess.directory?' · '+esc(wSess.directory.split(/[\\/]/).pop()):"")+'</div>';

    var wakeHolder = card.querySelector('[data-wake-holder="'+sid+'"]');
    if (!wakeHolder) {
      var btnrow = card.querySelector(".abtns");
      if (btnrow) {
        var wh = document.createElement("span");
        wh.setAttribute("data-wake-holder", sid);
        btnrow.appendChild(wh);
        wakeHolder = wh;
      }

  }
  var wb = document.querySelectorAll("[data-wake]");
  for (i=0;i<wb.length;i++) {
    var wbtn = wb[i];
    if (wbtn._bound) continue;

    wbtn.addEventListener("click", function(e){
      e.stopPropagation();
      var sid2 = this.getAttribute("data-wake");
      toast("唤醒中：中止卡死回合 + 续跑指令…");
      abortAnywhere(sid2).then(function(){
        return new Promise(function(r){ setTimeout(r, 1200); });
      }).then(function(){
        return sendMsg(sid2, RESUME_MSG, sendOpts());
      }).then(function(){ toast("已唤醒"); markDirty(); })
        .catch(function(){ toast("唤醒失败"); });

  for (i=0;i<ab.length;i++) {
    var btn = ab[i];
    if (btn._bound) continue;
    btn._bound = true;
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var sid2 = this.getAttribute("data-wab");
      toast("正在多通道发送中止信号…");
      abortAnywhere(sid2).then(function(h){ toast(h > 0 ? "已中止（命中 " + h + " 个实例）" : "中止失败：会话不在已知实例上"); markDirty(); });
    });
  }
}

function hasTextSelection(){
  var sel = window.getSelection ? window.getSelection() : null;
  if (!sel || sel.isCollapsed) return false;
  var dv = document.getElementById("dview");
  if (!dv || !sel.anchorNode) return false;
  return dv.contains(sel.anchorNode) || dv.contains(sel.focusNode);
}

async function refreshDetail(full){
  if (!S.curTask) return;
  var t = S.curTask;
  if (S.curTab !== refreshDetail._lastTab) { refreshDetail._sig = ""; dbgLog("渲染:" + S.curTab); }
  refreshDetail._lastTab = S.curTab;
  if (S.curTab === "acc") { renderAccView(); return; }
  if (S.curTab === "agents") {
    renderAgentsOverview();
    $("abort").style.display = t.sessionID ? "" : "none";
    $("ovabort").style.display = t.sessionID ? "" : "none";
    $("ovfork").style.display = t.sessionID ? "" : "none";
    $("ovset").style.display = t.sessionID ? "" : "none";
    $("ovmulti").style.display = (t.mode !== "multi" && t.stage === "exec") ? "" : "none";
    return;
  }
  var sid = S.viewSid || t.sessionID;
  if (!sid) {
    var dv0 = document.getElementById("dview");
    if (dv0) dv0.innerHTML = '<div class="empty">'+((t.workers||[]).length ? "分工智能体执行中… 全部完成后自动汇总" : "尚未创建会话<br>把任务移到「计划」或「执行」即可启动")+'</div>';
    $("abort").style.display = "none";
    $("ovabort").style.display = "none";
    return;
  }
  try {
    var myTok = refreshDetail._tok = (refreshDetail._tok || 0) + 1;
    S.msgs = (await api("/session/" + sid + "/message?limit=200")) || [];
    if (S.curTab !== "chat") S.todos = (await api("/session/" + sid + "/todo")) || [];
    if (myTok !== refreshDetail._tok) return;
    var dv = document.getElementById("dview");
    if (!dv) return;
    var sc = $("ovbody");
    var cSig = chatSig();
    var skipRender = !full && (cSig === refreshDetail._sig || hasTextSelection());
    refreshDetail._sig = cSig;
    if (S.curTab === "chat") {
      if (!skipRender) {
        var keepTop = sc.scrollTop;
        var wasNear = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
        dv.innerHTML = renderChat();
        bindChatExtras(dv);
        if (full || wasNear) {
          sc.scrollTop = sc.scrollHeight;
          requestAnimationFrame(function(){ sc.scrollTop = sc.scrollHeight; });
          setTimeout(function(){ if (S.curTask) sc.scrollTop = sc.scrollHeight; }, 380);
        }
        else sc.scrollTop = keepTop;
      }
    }
    else if (S.curTab === "todo") dv.innerHTML = renderTodos();
    else {
      dv.innerHTML = '<div class="empty">加载 git 改动…</div>';
      loadDiffView().then(function(h){ if (S.curTab === "diff") dv.innerHTML = h; });
    }
    var sc2 = $("ovbody");
    if (full && !skipRender) {
      sc2.scrollTop = sc2.scrollHeight;
      requestAnimationFrame(function(){ sc2.scrollTop = sc2.scrollHeight; });
    }
    else if (!skipRender) {
      var nb = sc2.scrollHeight - sc2.scrollTop - sc2.clientHeight < 140;
      if (nb) sc2.scrollTop = sc2.scrollHeight;
    }
    $("abort").style.display = sid ? "" : "none";
    $("ovabort").style.display = sid ? "" : "none";
    $("ovfork").style.display = sid ? "" : "none";
    $("ovset").style.display = sid ? "" : "none";
    $("ovmulti").style.display = (t.mode !== "multi" && t.stage === "exec") ? "" : "none";
  } catch(e){ console.warn("RD-ERR:", e && e.message, e && e.stack && e.stack.split("\n")[1]); }
}

function renderChat(){
  var sid = S.viewSid || (S.curTask ? S.curTask.sessionID : null);
  if (!S.msgs.length) return '<div class="empty">暂无消息</div>';
  var html = "";
  var t = S.curTask;
  if (t && (t.workers || []).length) {
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px dashed var(--ln)">';
    html += '<button class="abtn'+(S.viewSid?"":" go")+'" data-vs="">⌘ 主线'+(t.merged?"（已汇总）":"")+'</button>';
    if (t.mergeSid) html += '<button class="abtn'+(S.viewSid===t.mergeSid?" go":"")+'" data-vs="'+t.mergeSid+'">📦 汇总'+(activityOf(t.mergeSid)==="run"?" ●":"")+'</button>';
    var wl = t.workers || [];
    for (var wj=0;wj<wl.length;wj++) {
      var wAct2 = activityOf(wl[wj].sessionID);
      html += '<button class="abtn'+(S.viewSid===wl[wj].sessionID?" go":"")+'" data-vs="'+wl[wj].sessionID+'">◈ '+esc(wl[wj].role)+(wAct2==="run"?" ●":"")+'</button>';
    }
    html += '</div>';
  }
  if (S.viewSid) html += '<div style="margin:0 12px 6px;font-size:11px;color:var(--wn);letter-spacing:1px">⚠ 正在查看分工智能体对话（只读）</div>';
  for (var i=0;i<S.msgs.length;i++){
    var m = S.msgs[i], info = m.info || {};
    var parts = m.parts || [];
    var lastTool = -1;
    for (var j=0;j<parts.length;j++) if (parts[j].type === "tool") lastTool = j;
    var segs = [];
    for (j=0;j<parts.length;j++){
      var p = parts[j];
      if (p.type === "text" && p.text) segs.push({ kind:"text", text:p.text, final:(j > lastTool) });
      else if (p.type === "tool") segs.push({ kind:"tool", part:p });
    }
    if (!segs.length) continue;
    if (info.role === "user") {
      var ut = segs.filter(function(x){ return x.kind === "text"; }).map(function(x){ return x.text; }).join("\n\n");
      if (ut) html += '<div class="msg user"><div class="who">OPERATOR · '+fmtTime(info.time && info.time.created)+'</div>'+mdRender(ut)+'</div>';
      continue;
    }
    var intro = "";
    var finalTxt = "";
    for (j=0;j<segs.length;j++){
      var sg2 = segs[j];
      if (sg2.kind !== "text") continue;
      if (sg2.final && j > lastTool) finalTxt = sg2.text;
      else intro += mdRender(sg2.text);
    }
    var toolHtml = "";
    for (j=0;j<segs.length;j++){
      var sg3 = segs[j];
      if (sg3.kind !== "tool") continue;
      var t = sg3.part, stt = (t.state || {}).status || "pending";
      var ttl = (t.state && (t.state.title || t.state.name)) || "";
      var inp = "";
      try { inp = t.state && t.state.input ? JSON.stringify(t.state.input).slice(0,90) : ""; } catch(e){}
      var isAgent = (t.tool === "task");
      var fullOut = "";
      try { fullOut = String(((t.state||{}).output)||"").slice(0, 3000); } catch(e){}
      toolHtml += '<div class="sub '+(isAgent?"agent ":"")+(stt==="running"?"running":"")+'" style="cursor:pointer"><div class="t1"><span>'+(isAgent?"◈":"⚙")+'</span><span class="tn">'+esc(t.tool||"tool")+'</span><span class="tt">'+esc(ttl||inp)+'</span><span class="ts '+stt+'">'+({completed:"OK",running:"RUN",pending:"WAIT",error:"ERR"}[stt]||stt)+'</span></div>'+(stt==="running"&&toolTail(t)?('<pre style="margin:6px 0 0;background:var(--code-bg);border-radius:5px;padding:6px 8px;font-size:11px;max-height:110px;overflow:hidden;white-space:pre-wrap;word-break:break-all;color:#8fb8d8">'+esc(toolTail(t))+'<span style="color:var(--cy)">▌</span></pre>'):"")+(fullOut?'<pre class="fullout">'+esc(fullOut)+'</pre>':"")+'</div>';
    }
    html += '<div class="msg '+(info.role === "user" ? "user" : "assistant")+'" data-mid="'+esc(info.id||"")+'"><div class="who">'+(info.role === "user" ? "OPERATOR" : "AGENT")+' · '+fmtTime(info.time && info.time.created)+(modelShort(info.model)?' · <span style="color:var(--mut)">'+esc(modelShort(info.model))+'</span>':"")+(info.role !== "user" && info.id ? ' <button class="rvbtn" data-revert="'+esc(info.id)+'" title="回滚到此消息之前">↩</button>' : "")+'</div>' +
      (intro ? '<div class="mseg">'+intro+'</div>' : "") +
      toolHtml +
      (finalTxt ? '<div class="mseg final">'+mdRender(finalTxt)+'</div>' : "") +
      '</div>';
  }
  if (sid) {
    var kids = Object.keys(S.sessions).filter(function(k){ return S.sessions[k].parentID === sid; });
    var fresh = [], stale = 0;
    for (var k2=0;k2<kids.length;k2++) {
      var ku = (S.sessions[kids[k2]].time && S.sessions[kids[k2]].time.updated) || 0;
      if (ku > Date.now() - 2*3600*1000) fresh.push(kids[k2]); else stale++;
    }
    for (var ki=0;ki<fresh.length;ki++){
      var ks = S.sessions[fresh[ki]];
      var kact = activityOf(ks.id);

async function fsNav(p){

    var crs = document.querySelectorAll(".crumb .d");
    for (i=0;i<crs.length;i++) crs[i].onclick = function(){ fsNav(this.getAttribute("data-p")); };

      }
    };
    $("upBtn").onclick = function(){ $("fup").click(); };
    $("fup").onchange = async function(){
      var files = this.files;
      var cur = data.path;
      for (var j=0;j<files.length;j++){
        try {

}

async function unlinkedSessions(){
  var arr = await api("/session");
  var linked = {};
  for (var k in S.tasks) if (S.tasks[k].sessionID) linked[S.tasks[k].sessionID] = 1;
  var out = [];
  for (var i=0;i<(arr||[]).length;i++) if (!linked[arr[i].id] && !isWorkerSession(arr[i])) out.push(arr[i]);
  out.sort(function(a,b){ return ((b.time&&b.time.updated)||0) - ((a.time&&a.time.updated)||0); });
  return out;
}
function importStageFor(s){

async function refreshMini(force){
  if (!S.miniSid) return;
  try {
    var msgs = (await api("/session/" + S.miniSid + "/message?limit=100")) || [];
    var sig = msgs.length + ":" + (msgs.length ? ((msgs[msgs.length-1].parts||[]).length) + ":" + ((msgs[msgs.length-1].info||{}).id||"") + ":" + JSON.stringify((msgs[msgs.length-1].parts||[]).map(function(p){ return p.type==="tool" ? ((p.state||{}).status||"")+(((p.state||{}).output||"").length) : ((p.text||"").length); })) : "");
    if (!force && sig === miniSig) return;
    miniSig = sig;
    var act = activityOf(S.miniSid);
    $("mwdot").style.display = act === "run" ? "" : "none";
    var html = "";
    for (var i=0;i<msgs.length;i++){
      var m = msgs[i], info = m.info || {};
      var parts = m.parts || [];
      var lastTool = -1;
      for (var j=0;j<parts.length;j++) if (parts[j].type === "tool") lastTool = j;
      var tx = [], tools = [];
      for (j=0;j<parts.length;j++){
        var p = parts[j];
        if (p.type === "text" && p.text) { if (j > lastTool) tx.push(p.text); }
        else if (p.type === "tool") tools.push(p);
      }
      if (!tx.length && !tools.length) continue;
      html += '<div class="msg '+(info.role === "user" ? "user" : "assistant")+'"><div class="who">'+(info.role === "user" ? "OPERATOR" : "AGENT")+' · '+fmtTime(info.time && info.time.created)+'</div>'+mdRender(tx.join("\n\n"))+'</div>';
      for (j=0;j<tools.length;j++){
        var tt = tools[j], stt = (tt.state || {}).status || "pending";
        var ttl = (tt.state && (tt.state.title || tt.state.name)) || "";
        html += '<div class="sub '+(stt==="running"?"running":"")+'"><div class="t1"><span>⚙</span><span class="tn">'+esc(tt.tool||"tool")+'</span><span class="tt">'+esc(ttl)+'</span><span class="ts '+stt+'">'+({completed:"OK",running:"RUN",pending:"WAIT",error:"ERR"}[stt]||stt)+'</span></div>'+(stt==="running"?('<pre style="margin:6px 0 0;background:var(--code-bg);border-radius:5px;padding:6px 8px;font-size:11px;max-height:110px;overflow:hidden;white-space:pre-wrap;word-break:break-all;color:#8fb8d8">'+esc(toolTail(tt))+'<span style="color:var(--cy)">▌</span></pre>'):"")+'</div>';
      }
    }
    $("mwb").innerHTML = html || '<div class="empty">暂无消息</div>';
    var msubs = $("mwb").querySelectorAll(".sub");
    for (var ms2=0; ms2<msubs.length; ms2++) msubs[ms2].addEventListener("click", function(e2){
      if (e2.target.tagName === "A") return;
      this.classList.toggle("xopen");
    });
    $("mwb").scrollTop = $("mwb").scrollHeight;
  } catch(e){}
}

    S.curTab = "agents";
    renderBoard._sig = "";
    refreshAll();
    toast("分支智能体已启动，见「◈ 分工」页");
  } catch(e){ toast("失败: " + (e.message || e)); }
};
$("adlg").addEventListener("click", function(e){ if (e.target === $("adlg")) $("acancel").click(); });

$("inp").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia && window.matchMedia("(pointer:fine)").matches) {
    e.preventDefault();
    $("send").click();
  }
});
$("abort").onclick = doAbort;
$("ovabort").onclick = doAbort;
async function doAbort(){
  if (!S.curTask || !S.curTask.sessionID) return;
  toast("正在多通道发送中止信号…");
  var hits = await abortAnywhere(S.curTask.sessionID);
  toast(hits > 0 ? "已中止（命中 " + hits + " 个实例）" : "中止失败：目标会话可能不在任何已知实例上");
  markDirty();
}

async function loadBackends(){
  try {
    var r = await fetch("/backends");
    var bs = await r.json();
    var sel = $("bk");
    sel.innerHTML = "";
    for (var i=0;i<bs.length;i++){
      var o = document.createElement("option");
      o.value = bs[i].port;
      o.textContent = bs[i].name + ":" + bs[i].port;
      sel.appendChild(o);
    }
    if (!bs.find(function(b){ return String(b.port) === S.backend; })) S.backend = String(bs[0].port);
    sel.value = S.backend;
  } catch(e){}
  try {
    var r2 = await fetch("/backends");
    S.backends = await r2.json();
  } catch(e2){}
}
$("bk").onchange = function(){
  S.backend = this.value;
  localStorage.setItem("oc_backend", S.backend);
  S.perms = {}; S.questions = {}; S.curTask = null; S.statuses = {};
  closeDetail();
  sseStart();
  refreshAll();
};

async function abortAnywhere(sid){
  if (!sid) return 0;
  var ports = S.backends.map(function(b){ return b.port; }).slice();
  try {
    var r = await fetch("/ocinstances");
    var ins = await r.json();
    for (var i=0;i<(ins.ports||[]).length;i++) if (ports.indexOf(ins.ports[i]) < 0) ports.push(ins.ports[i]);
  } catch(e){}
  var hits = 0;
  for (i=0;i<ports.length;i++) {
    try {
      var rr = await fetch("/api/session/" + sid + "/abort", { method: "POST", headers: { "x-pilot-backend": String(ports[i]) } });
      if (rr.ok || rr.status === 200 || rr.status === 204) hits++;
    } catch(e2){}
  }
  return hits;
}

async function prefetchTodos(){
  for (var sid in S.sessions) {
    if (!S.sessions[sid]._todo) {
      (function(id){
        api("/session/" + id + "/todo").then(function(t){ if (S.sessions[id]) S.sessions[id]._todo = t || []; });
      })(sid);
    }
  }
}
async function prefetchLiveTools(){
  for (var sid in S.sessions) {
    if (activityOf(sid) === "run") {
      (function(id){
        api("/session/" + id + "/message?limit=2").then(function(msgs){
          var tools = [];
          var outLen = 0;
          for (var i=0;i<(msgs||[]).length;i++) {
            var parts = msgs[i].parts || [];
            for (var j=0;j<parts.length;j++) {
              var p = parts[j];
              if (p.type === "tool") {
                var st = (p.state || {}).status || "";
                if (st === "running" || st === "pending") {
                  var ttl = (p.state && (p.state.title || p.state.name)) || "";
                  if (!ttl) { try { ttl = p.state && p.state.input ? JSON.stringify(p.state.input).slice(0,70) : ""; } catch(e){} }
                  tools.push({ tool: p.tool || "tool", title: ttl });
                  outLen += ((p.state && p.state.output) || "").length;
                }
              }
            }
          }
          S.liveTools[id] = tools;
          if (!tools.length) delete S.liveTools[id];
          if (tools.length) {
            if (S.toolLen[id] === outLen) { if (!S.stuckSince[id]) S.stuckSince[id] = Date.now(); }
            else S.stuckSince[id] = 0;
            S.toolLen[id] = outLen;
          } else {
            delete S.toolLen[id];
            delete S.stuckSince[id];
          }
        }).catch(function(){ delete S.liveTools[id]; });
      })(sid);
    } else if (S.liveTools[sid]) delete S.liveTools[sid];
  }
}

(function(){
  if (localStorage.getItem("oc_theme_boot") !== "1.3.1") {
    localStorage.setItem("oc_theme", "orange");
    localStorage.setItem("oc_theme_boot", "1.3.1");
  }
})();
applyTheme(localStorage.getItem("oc_theme") || "orange");
S.fastMs = parseInt(localStorage.getItem("oc_fastms") || "2500", 10);
loadBackends();
loadSelectorData();
loadAgentsList();
sseStart();
refreshAll();
fastLoop();
(function(){
  var m = location.hash.match(/^#t=([a-z0-9]+)/i);
  if (m) {
    var tryOpen = setInterval(function(){
      if (S.tasks[m[1]]) { clearInterval(tryOpen); openDetail(m[1]); }
      else if (S._loadedOnce) clearInterval(tryOpen);
    }, 400);
    setTimeout(function(){ clearInterval(tryOpen); }, 15000);
  }
})();
setInterval(function(){ markDirty(); prefetchTodos(); prefetchLiveTools(); }, 12000);
setInterval(function(){ markDirty(); prefetchTodos(); prefetchLiveTools(); }, 12000);
async function fastLoop(){
  while (true){
    await new Promise(function(r){ setTimeout(r, S.fastMs || 2500); });
    try {
      if (Date.now() - S.lastSseOk > 25000) {
        dbgLog("SSE 看门狗触发重连");
        sseStart();
      }
      for (var sid in S.queue) {
        if (S.queue[sid] && S.queue[sid].length && activityOf(sid) !== "run") {
          var txt = S.queue[sid].shift();
          try { await sendMsg(sid, txt); toast("队列消息已发出"); markDirty(); } catch(e){}
        }
      }
      if ((S.curTask || S.fsMode) && $("ovl").classList.contains("open")) refreshDetail(false);
      prefetchLiveTools();
      if (S.miniSid) refreshMini(false);
      if (S.curTask && S.curTask.mode === "multi") fetchWorkerInfos();
      checkMultiTasks();
    } catch(e){}
  }
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) { S.lastSseOk = 0; refreshAll(); prefetchTodos(); prefetchLiveTools(); } });
window.addEventListener("online", function(){ S.lastSseOk = 0; sseStart(); refreshAll(); });

$("dlg").addEventListener("click", function(e){ if (e.target === $("dlg")) $("dcancel").click(); });
$("idlg").addEventListener("click", function(e){ if (e.target === $("idlg")) $("iclose").click(); });
$("fdlg").addEventListener("click", function(e){ if (e.target === $("fdlg")) $("fcancel").click(); });
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if ($("dlg").style.display === "flex") { $("dcancel").click(); return; }
  if ($("fdlg").style.display === "flex") { $("fcancel").click(); return; }
  if ($("idlg").style.display === "flex") { $("iclose").click(); return; }
  if ($("adlg").style.display === "flex") { $("acancel").click(); return; }
  if ($("mwin").style.display === "flex") { $("mwclose").click(); return; }
  if ($("ovl").classList.contains("open")) { closeDetail(); return; }
});
</script>
